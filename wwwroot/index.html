<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Akıllı Dedektiflik RPG</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Special+Elite&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap"
        rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="noir-theme">

    <!-- 1. SPLASH SCREEN -->
    <div id="splash-screen" class="splash-container">
        <div class="splash-glass">
            <h1 class="game-title">D E D E K T İ F</h1>
            <h3 class="game-subtitle">KARANLIK KASABANIN SIRRI</h3>
            <button id="start-btn" class="btn btn-primary btn-glow"
                style="margin-top:20px; font-size:1.5rem; padding:15px 30px;">
                <i class="fa-solid fa-folder-open"></i> DOSYAYI AÇ VE BAŞLA
            </button>
        </div>
    </div>

    <!-- 2. FULL SCREEN TOWN MAP -->
    <div id="town-map-screen" class="full-screen-map hidden">
        <button id="exit-game-btn" class="global-exit-btn"><i class="fa-solid fa-door-open"></i> Oyundan Çık / Ana
            Menü</button>
        <button id="open-bag-btn" class="global-bag-btn"><i class="fa-solid fa-briefcase"></i> Çanta</button>

        <!-- Dağınık Binalar -->
        <!-- Eczane -->
        <div class="map-building" style="top: 20%; left: 15%;" data-npc-id="2">
            <i class="fa-solid fa-prescription-bottle-medical"></i>
            <span class="map-building-label">Eczane</span>
        </div>
        <!-- Kasap -->
        <div class="map-building" style="top: 30%; right: 20%;" data-npc-id="1">
            <i class="fa-solid fa-store"></i>
            <span class="map-building-label">Kasap</span>
        </div>
        <!-- Muhtarlık -->
        <div class="map-building" style="top: 60%; left: 40%;" data-npc-id="3">
            <i class="fa-solid fa-building-flag"></i>
            <span class="map-building-label">Muhtarlık</span>
        </div>
        <!-- Karakol (Pasif) -->
        <div class="map-building inactive" style="top: 75%; left: 10%;" data-npc-id="4">
            <i class="fa-solid fa-building-shield"></i>
            <span class="map-building-label">Karakol</span>
        </div>
        <!-- Terzi (Pasif) -->
        <div class="map-building inactive" style="top: 65%; right: 15%;" data-npc-id="5">
            <i class="fa-solid fa-scissors"></i>
            <span class="map-building-label">Terzi</span>
        </div>
    </div>

    <!-- 3. BUILDING INTERIOR SCREEN -->
    <div id="interior-screen" class="full-screen-interior hidden">
        <div class="rain-overlay"></div>

        <button id="leave-building-btn" class="global-exit-btn" style="top: 20px; left: 20px;">
            <i class="fa-solid fa-person-walking-arrow-right"></i> Haritaya Dön
        </button>
        <button id="interior-bag-btn" class="global-bag-btn"><i class="fa-solid fa-briefcase"></i> Çanta</button>

        <!-- Sağ Alt Köşe Konuş Butonu -->
        <button id="talk-npc-btn" class="talk-corner-btn">
            <i class="fa-solid fa-comments"></i> <span id="talk-npc-name">Karakter İle Konuş</span>
        </button>

        <!-- Hotspots for Objects (Dynamically injected) -->
        <div id="hotspots-container"></div>
    </div>

    <!-- INVENTORY (BAG) MODAL -->
    <div id="bag-modal" class="modal-backdrop hidden">
        <div class="bag-card">
            <button id="close-bag-btn" class="close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
            <h2><i class="fa-solid fa-briefcase"></i> Dedektif Çantası</h2>
            <div id="bag-items-list" class="bag-items-grid">
                <!-- Bulunan ipuçları buraya eklenecek -->
            </div>
        </div>
    </div>

    <!-- OBJECT DESCRIPTION MODAL (Mini Yazı) -->
    <div id="object-desc-modal" class="modal-backdrop hidden" style="background: rgba(0,0,0,0.4); z-index: 2000;">
        <div class="clue-decide-card" style="max-width: 400px; text-align:center;">
            <div class="clue-icon"><i class="fa-solid fa-magnifying-glass"></i></div>
            <h3 id="obj-title" style="color:var(--text-bright); margin-bottom:10px;">Nesne Adı</h3>
            <p id="obj-desc" style="color:var(--text-muted); font-size:1.1rem;">Nesne Açıklaması...</p>
            <button id="obj-close-btn" class="btn btn-primary" style="margin-top:20px; width:100%;">Tamam (Çantaya
                Eklendi)</button>
        </div>
    </div>

    <!-- INTERROGATION MODAL -->
    <div id="interrogation-modal" class="modal-backdrop hidden">
        <div class="interrogation-container">
            <div class="interrogation-header">
                <div class="npc-mini-profile">
                    <h2 id="int-npc-name">NPC İsim</h2>
                </div>
                <button id="close-int-btn" class="close-modal-btn"><i class="fa-solid fa-xmark"></i> Geri Dön</button>
            </div>

            <div class="interrogation-focus-area">
                <div class="chat-console" style="flex:2;">
                    <div class="chat-history" id="chat-history-box"></div>
                </div>

                <div class="avatar-side npc-side" style="flex:1;">
                    <div class="npc-live-stats">
                        <div class="stat-group">
                            <label>🤝 Güven Seviyesi</label>
                            <div class="progress-bar-container">
                                <div id="int-trust-bar" class="progress-bar trust-bar" style="width: 50%;"></div>
                            </div>
                            <span id="int-trust-text" class="stat-val">50%</span>
                        </div>
                        <div class="stat-group">
                            <label>😰 Korku Seviyesi</label>
                            <div class="progress-bar-container">
                                <div id="int-fear-bar" class="progress-bar fear-bar" style="width: 30%;"></div>
                            </div>
                            <span id="int-fear-text" class="stat-val">30%</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="interrogation-footer">
                <div class="dialog-options-wrapper" style="width:100%;">
                    <span class="evidence-title"><i class="fa-solid fa-comments"></i> Sorular:</span>
                    <div class="dialog-options-container" id="dialog-options-container">
                        <!-- Dialog buttons dynamically loaded -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- TRANSITION OVERLAY -->
    <div id="transition-overlay" class="transition-overlay"></div>

    <script src="js/app.js"></script>
</body>

</html>
